appId: com.playlistvideomaker.app
productName: Playlist Video Maker
# Không có module native cần build lại (@napi-rs/canvas dùng bản N-API dựng sẵn)
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!node_modules/@napi-rs/canvas-linux-x64-musl/**'
  # AI căn lời: ONNX Runtime bản native (thư viện từng hệ điều hành lọc ở mục win / mac / linux bên dưới) và bản
  # WebAssembly dự phòng — chỉ cần bản cho Node và một bộ .wasm, bỏ các bản cho trình duyệt (~130 MB)
  - '!node_modules/onnxruntime-node/{lib,script}/**'
  # Chỉ giữ thư viện cho hệ điều hành và loại chip đang đóng gói (mỗi máy build đóng gói cho chính nó). Không đặt
  # mục files riêng trong win / mac / linux: electron-builder dùng nó thay hẳn cho danh sách này chứ không gộp
  - '!node_modules/onnxruntime-node/bin/napi-v6/!(${platform})/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/${platform}/!(${arch})/**'
  # Mac: thư viện nạp libonnxruntime.1.dylib; bản .1.30.0 là bản sao y hệt (npm không giữ được liên kết tắt), 45 MB
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/*/libonnxruntime.1.*.*.dylib'
  - '!node_modules/onnxruntime-web/{lib,docs}/**'
  - '!node_modules/onnxruntime-web/dist/!(ort.node.min.js|ort-wasm-simd-threaded.mjs|ort-wasm-simd-threaded.wasm)'
extraResources:
  - from: resources/fonts
    to: fonts
asarUnpack:
  - out/main/**
  - node_modules/ffmpeg-static/**
  - node_modules/@napi-rs/**
  # Tiến trình AI căn lời chạy từ out/main giải nén nên các gói nó nạp cũng phải nằm ngoài asar
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - node_modules/onnxruntime-web/**
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Cài cho người dùng hiện tại, không cần quyền Administrator
  perMachine: false
  # Giao diện bộ cài tiếng Việt (LCID 1066)
  language: '1066'
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # Gỡ app thì xoá luôn bộ nhớ đệm âm thanh ở %LOCALAPPDATA%
  include: build/installer.nsh
  artifactName: Playlist-Video-Maker-Setup-${version}.${ext}
portable:
  artifactName: Playlist-Video-Maker-Portable-${version}.${ext}
# Tên file cài không có dấu cách: link tải trên GitHub Releases và trang landing (site/) gọn, dễ đọc
linux:
  target: [AppImage, deb]
  artifactName: Playlist-Video-Maker-${version}-${arch}.${ext}
  category: AudioVideo
  maintainer: Playlist Video Maker
mac:
  # Mỗi máy build đóng gói cho đúng loại chip của nó (Mac chip Apple: arm64, Mac Intel: x64) vì FFmpeg và thư viện
  # vẽ @napi-rs/canvas được npm tải theo chip của máy build
  target: [dmg]
  category: public.app-category.video
  # Chưa có chứng chỉ Apple Developer ID: ký ad-hoc. Mac chip Apple bắt buộc ứng dụng phải được ký (dù là ad-hoc)
  # mới chạy được; lần đầu mở cần cho phép trong Cài đặt hệ thống (xem README). Có chứng chỉ thì thay "-" bằng tên
  # chứng chỉ, bật hardenedRuntime và notarize.
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    # Tuỳ chọn "Tắt máy khi xuất xong" gửi lệnh tắt máy tới System Events (macOS hỏi quyền lần đầu)
    NSAppleEventsUsageDescription: Playlist Video Maker cần quyền này để tắt máy khi xuất video xong (chỉ khi bạn chọn).
  artifactName: Playlist-Video-Maker-${version}-${arch}.${ext}
dmg:
  artifactName: Playlist-Video-Maker-${version}-${arch}.${ext}
