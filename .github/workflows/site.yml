name: Site

# Trang landing (site/): build bằng Astro rồi đăng lên GitHub Pages (https://hoangduong2k.github.io/mpv-creator/).
# Chạy khi trang hoặc phần dùng chung với app thay đổi, và sau mỗi lần phát hành (job release trong build.yml gọi
# workflow này) để link tải trỏ tới bản mới.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/shared/theme.css'
      - 'src/engine/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # GITHUB_TOKEN: đọc bản phát hành mới nhất qua API không bị giới hạn lượt
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
