name: Build

on:
  push:
    tags: ['v*']
    branches: [main]
    # Chỉ đổi trang landing thì không cần kiểm thử / đóng gói lại app (tag v* vẫn luôn chạy)
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

env:
  # AI căn lời: onnxruntime-node khi cài trên Linux tự tải thêm bộ CUDA ~270 MB; app chỉ chạy AI bằng CPU
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # Kiểm thử trên máy Windows, Linux và Mac thật: kiểu, unit test, e2e (điều khiển app bằng chuột thật)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci trên từng hệ điều hành sẽ tải đúng ffmpeg và @napi-rs/canvas cho hệ đó
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run e2e
      - name: E2E (Linux, màn hình ảo)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e
      - name: E2E (macOS)
        if: runner.os == 'macOS'
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ runner.os }}
          path: test-output/e2e/*.png
          if-no-files-found: ignore

  # Đóng gói bộ cài, rồi chạy e2e lần nữa trên chính bản đã đóng gói.
  # Mac: macos-latest là máy chip Apple (bản arm64), macos-15-intel là máy Intel (bản x64)
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      # Mô hình AI (Whisper base, ~80 MB) tải một lần rồi giữ lại cho các lần chạy sau
      - uses: actions/cache@v4
        with:
          path: test-output/ai-smoke/userdata/audio-cache/models
          key: whisper-base-q8-v1
      - name: E2E trên bản đóng gói (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: PVM_E2E_EXE="$PWD/release/win-unpacked/Playlist Video Maker.exe" npm run e2e
      - name: E2E trên bản đóng gói (Linux)
        if: runner.os == 'Linux'
        run: PVM_E2E_EXE="$PWD/release/linux-unpacked/playlist-video-maker" xvfb-run -a npm run e2e
      - name: E2E trên bản đóng gói (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d release/mac*/"Playlist Video Maker.app" | head -n 1)
          codesign --verify --deep --verbose=2 "$APP"
          PVM_E2E_EXE="$PWD/$APP/Contents/MacOS/Playlist Video Maker" npm run e2e
      # AI căn lời chạy thật trên bản đóng gói (Mac Intel: bản WebAssembly dự phòng, máy khác: bản native)
      - name: AI căn lời trên bản đóng gói (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: PVM_E2E_EXE="$PWD/release/win-unpacked/Playlist Video Maker.exe" npm run ai-smoke
      - name: AI căn lời trên bản đóng gói (Linux)
        if: runner.os == 'Linux'
        run: PVM_E2E_EXE="$PWD/release/linux-unpacked/playlist-video-maker" xvfb-run -a npm run ai-smoke
      - name: AI căn lời trên bản đóng gói (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d release/mac*/"Playlist Video Maker.app" | head -n 1)
          PVM_E2E_EXE="$PWD/$APP/Contents/MacOS/Playlist Video Maker" npm run ai-smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-packaged-screenshots-${{ matrix.os }}
          path: test-output/e2e/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: playlist-video-maker-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
          if-no-files-found: error

  # Đẩy tag v* (vd. v0.2.0): sau khi kiểm thử, đóng gói và e2e trên bản đóng gói đều đạt, tạo GitHub Release kèm
  # các file cài. Ghi chú phát hành lấy từ mục của phiên bản đó trong CHANGELOG.md. Trang landing (site/) lấy link
  # tải từ bản Release mới nhất.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag phải khớp version trong package.json
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME khác version v$V trong package.json"; exit 1; }
      - name: Ghi chú phát hành từ CHANGELOG.md
        run: |
          awk -v head="## $GITHUB_REF_NAME" 'index($0, head) == 1 { on = 1; next } /^## / { if (on) exit } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md chưa có mục $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: playlist-video-maker-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Playlist Video Maker ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
      # Build lại trang landing để nút tải trỏ tới bản vừa phát hành (sự kiện do GITHUB_TOKEN tạo không tự chạy
      # workflow khác, trừ khi gọi workflow_dispatch như thế này)
      - name: Cập nhật trang landing
        run: gh workflow run site.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
