name: Build

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Kiểm thử trên máy Windows và Linux thật: kiểu, unit test, e2e (điều khiển app bằng chuột thật)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci trên từng hệ điều hành sẽ tải đúng ffmpeg và @napi-rs/canvas cho hệ đó
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run e2e
      - name: E2E (Linux, màn hình ảo)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ runner.os }}
          path: test-output/e2e/*.png
          if-no-files-found: ignore

  # Đóng gói bộ cài, rồi chạy e2e lần nữa trên chính bản đã đóng gói
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      - name: E2E trên bản đóng gói (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: PVM_E2E_EXE="$PWD/release/win-unpacked/Playlist Video Maker.exe" npm run e2e
      - name: E2E trên bản đóng gói (Linux)
        if: runner.os == 'Linux'
        run: PVM_E2E_EXE="$PWD/release/linux-unpacked/playlist-video-maker" xvfb-run -a npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: playlist-video-maker-${{ runner.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
